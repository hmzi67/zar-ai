seed: 42
experiment: wheat_v1_dinov2_linear
mlflow:
  tracking_uri: file:./mlruns
  experiment: wheat_v1_baselines
data:
  splits_csv: ${paths.splits}/wheat_v1.csv
  image_size: 224
  eval_resize: 256
  num_workers: 12
model:
  name: vit_small_patch14_dinov2.lvd142m
  hf_revision: 4610ca143709d58a633b6397a74412c2c3842454
  pretrained: true
  freeze_backbone: true
train:
  device: cuda
  epochs: 25
  batch_size: 64
  eval_batch_size: 128
  lr: 3.0e-4
  weight_decay: 0.05
  warmup_epochs: 1
  label_smoothing: 0.1
  early_stopping_patience: 5
  sampler_power: 0.5 # sqrt inverse class frequency
  augment:
    crop_scale: [0.6, 1.0]
    randaugment_ops: 2
    randaugment_magnitude: 9
    jitter: 0.1
    jitter_hue: 0.02
eval:
  n_bootstrap: 1000
  gradcam_per_class: 16
  onnx_tolerance: 1.0e-4
  onnx_check_images: 16
calibration:
  target_coverage: 0.8
